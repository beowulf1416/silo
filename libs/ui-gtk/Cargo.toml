[package]
name = "ui-gtk"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing = "*"
tracing-subscriber = "*"

serde_json = "*"

tokio = { version = "*", features = ["full"] }
gtk = { version = "*", package = "gtk4", features = ["v4_22"] }
