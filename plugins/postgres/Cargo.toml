[package]
name = "postgres"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing = "*"
serde = "*"
async-channel = "*"
async-trait = "*"

gtk = { version = "*", package = "gtk4", features = ["v4_22"] }
sourceview5 = "*"

tokio = { version = "*", features = ["full"] }
sqlx = { version = "*", features = ["postgres", "uuid", "chrono", "macros", "runtime-tokio", "tls-rustls"] }




# projects
silo-plugin = { path = "../../libs/silo-plugin" }
